<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo práctico 2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- - Ejercicio 1-->
    <h2>Ejercicio 1: block vs inline</h2>

    <div class="bloque">Bloque 1</div>
    <div class="bloque">Bloque 2</div>

    <span class="en-linea">Inline 1</span>
    <span class="en-linea">Inline 2</span>

    <hr>

    <!-- - Ejercicio 2-->
    <h2>Ejercicio 2: inline-block</h2>

    <div class="caja">Caja 1</div>
    <div class="caja">Caja 2</div>
    <div class="caja">Caja 3</div>

    <hr>

    <!-- - Ejercicio 3-->
    <h2>Ejercicio 3: display none</h2>

    <p id="texto" class="oculto">Texto oculto</p>
    <button id="boton">Mostrar/ocultar texto</button>

    <input type="checkbox" id="mycheckbox">
    <label for="mycheckbox">Mostrar container</label>

    <div class="container">
        <p>Soy el container oculto</p>
    </div>
    
    <hr>

    <!-- - Ejercicio 4-->
    <h2>Ejercicio 4: list-item</h2>

    <div class="lista">Elemento 1</div>
    <div class="lista">Elemento 2</div>
    <div class="lista">Elemento 3</div>

    <hr>

    <!-- - Ejercicio 5-->
    <h2>Ejercicio 5: display table</h2>

    <div class="mi-tabla">
        <div class="fila">
            <div class="celda">Celda 1</div>
            <div class="celda">Celda 2</div>
        </div>
        <div class="fila">
            <div class="celda">Celda 3</div>
            <div class="celda">Celda 4</div>
        </div>
    </div>

</body>

<script src="script.js"></script>

</html>
